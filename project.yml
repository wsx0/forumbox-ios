name: ForumBox
options:
  bundleIdPrefix: com.forumbox
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    SUPPORTS_MACCATALYST: "NO"

targets:
  ForumBox:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "Assets.xcassets"
          - "Reader.js"
          - "AdBlockRules.json"
      - path: Sources/Assets.xcassets
        buildPhase: resources
      - path: Sources/Reader.js
        buildPhase: resources
      - path: Sources/AdBlockRules.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.forumbox.app
        PRODUCT_NAME: ForumBox
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: "NO"
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: "论坛盒子"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UIUserInterfaceStyle: Dark
        UIRequiresFullScreen: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false

schemes:
  ForumBox:
    build:
      targets:
        ForumBox: all
    run:
      config: Debug
    archive:
      config: Release
