name: ForumBox
options:
  bundleIdPrefix: com.forumbox
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "3.31.0"
    CURRENT_PROJECT_VERSION: "68"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    SUPPORTS_MACCATALYST: "NO"

targets:
  ForumBox:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "Assets.xcassets"
          - "Reader.js"
          - "AdBlockRules.json"
          - "AlternateIcons"
      - path: Sources/Assets.xcassets
        buildPhase: resources
      - path: Sources/AlternateIcons
        buildPhase: resources
        excludes:
          - "generate_icons.py"
      - path: Sources/Reader.js
        buildPhase: resources
      - path: Sources/AdBlockRules.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.forumbox.app
        PRODUCT_NAME: ForumBox
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: "NO"
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: "赛博盒子"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - AppIcon60x60
          CFBundleAlternateIcons:
            IconSakura:
              CFBundleIconFiles:
                - IconSakura
              UIPrerenderedIcon: false
            IconCat:
              CFBundleIconFiles:
                - IconCat
              UIPrerenderedIcon: false
            IconMoon:
              CFBundleIconFiles:
                - IconMoon
              UIPrerenderedIcon: false
            IconStar:
              CFBundleIconFiles:
                - IconStar
              UIPrerenderedIcon: false
            IconCyber:
              CFBundleIconFiles:
                - IconCyber
              UIPrerenderedIcon: false
            IconBunny:
              CFBundleIconFiles:
                - IconBunny
              UIPrerenderedIcon: false
            IconMatcha:
              CFBundleIconFiles:
                - IconMatcha
              UIPrerenderedIcon: false
            IconPeach:
              CFBundleIconFiles:
                - IconPeach
              UIPrerenderedIcon: false
            IconOcean:
              CFBundleIconFiles:
                - IconOcean
              UIPrerenderedIcon: false
            IconPixel:
              CFBundleIconFiles:
                - IconPixel
              UIPrerenderedIcon: false
        LSRequiresIPhoneOS: true
        UIRequiresFullScreen: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSPhotoLibraryUsageDescription: "选择一张图片作为 App 背景"
        ITSAppUsesNonExemptEncryption: false

schemes:
  ForumBox:
    build:
      targets:
        ForumBox: all
    run:
      config: Debug
    archive:
      config: Release
